[package]
name = "simplemarkdown"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Terminal Markdown preview renderer for Vim 9"
license = "MIT"
repository = "https://github.com/beamiter/simplemarkdown"
readme = "README.md"
keywords = ["vim", "markdown", "preview", "terminal"]
categories = ["command-line-utilities", "text-editors"]
publish = false

[[bin]]
name = "simplemarkdown-daemon"
path = "src/simplemarkdown/simplemarkdown_daemon.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "net" is the browser preview's whole dependency: the daemon serves the
# rendered page from a hand-rolled HTTP/1.1 loop on a TcpListener.  It brings
# mio, socket2 and libc with it, which is the price of a socket; a web framework
# would have brought a release schedule.  Shelling out to one — which is what
# `omd` was — is what this replaced, because a preview whose stylesheet is
# compiled into somebody else's binary is not a preview this plugin owns.
tokio = { version = "1", features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
# default-features = false drops the html renderer and getopts; the daemon only
# ever walks the event stream.
pulldown-cmark = { version = "0.13", default-features = false }
# regex-fancy keeps the build pure Rust: the onig backend needs a C toolchain,
# which would break `cargo install` on the machines this plugin targets.
syntect = { version = "5", default-features = false, features = [
  "default-syntaxes",
  "parsing",
  "regex-fancy",
] }
unicode-width = "0.2"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
strip = true
